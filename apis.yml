aid: quadratic
name: Quadratic
description: >-
  Quadratic is an AI-native infinite spreadsheet that combines Python, SQL, JavaScript,
  formulas, and AI agents on a single canvas, with live connections to databases like
  PostgreSQL, MySQL, BigQuery, and Snowflake. Its token-authenticated Developer
  (Spreadsheet) API and remote MCP server let agents and applications programmatically
  read and write cells, run code and SQL, build tables, and orchestrate spreadsheets.
