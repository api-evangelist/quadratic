openapi: 3.2.0
info:
  title: Quadratic Developer Documentation API
  description: Token-authenticated REST API for Quadratic spreadsheets.
  contact:
    name: Quadratic
  license:
    name: Apache-2.0
  version: 0.26.9
tags:
- name: Documentation
  description: OpenAPI spec and Scalar viewer.
paths:
  /openapi.json:
    get:
      tags:
      - Documentation
      summary: Serves the raw OpenAPI 3.1 spec for the developer API.
      operationId: openapiSpec
      responses:
        '200':
          description: OpenAPI 3.1 spec for this service
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: API token (qdx_live_… or qdx_test_…)
      description: 'API tokens are minted from the Quadratic UI under Team Settings → API Tokens. Send as `Authorization: Bearer <token>`.'
